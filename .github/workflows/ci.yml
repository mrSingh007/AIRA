name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aira_test
          POSTGRES_PASSWORD: aira_ci_test
          POSTGRES_DB: aira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aira_test -d aira_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://aira_test:aira_ci_test@127.0.0.1:5432/aira_test
      AIRA_TEST_DATABASE_URL: postgresql://aira_test:aira_ci_test@127.0.0.1:5432/aira_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        env:
          AIRA_LOAD_REPORT: ${{ runner.temp }}/aira-load-report.json
        run: npm test

      - name: Build application and check types
        run: npm run build
