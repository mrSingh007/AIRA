name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kangentix_test
          POSTGRES_PASSWORD: kangentix_ci_test
          POSTGRES_DB: kangentix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kangentix_test -d kangentix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kangentix_test:kangentix_ci_test@127.0.0.1:5432/kangentix_test
      KANGENTIX_TEST_DATABASE_URL: postgresql://kangentix_test:kangentix_ci_test@127.0.0.1:5432/kangentix_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        env:
          # Shared hosted runners use a 5s guardrail; local tests default to 1s.
          KANGENTIX_LOAD_MAX_P95_MS: '5000'
          KANGENTIX_LOAD_REPORT: ${{ runner.temp }}/kangentix-load-report.json
        run: npm test

      - name: Build application and check types
        run: npm run build
